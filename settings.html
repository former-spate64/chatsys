<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOTchatsys</title>
    <link rel="stylesheet" href="settings.css">
    <link rel="stylesheet" href="Shared.css">
    <script src="settings.js"></script>
</head>
<body>
<button id="back" onclick="window.location.href='index.html'">Back</button>
    <main>
        <section id="settingsContent">
            <h2>Settings</h2>
            <label for="themeSelect">Theme:</label>
            <select id="themeSelect">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
                <option value="blue">Blue</option>
            </select>
            <script src="Shared.js"></script>
            <br><br>
            <label for="notificationsToggle">Enable Notifications:</label>
            <input type="checkbox" id="notificationsToggle">
        </section>
    </main>
    <footer id="footer">
        <p>&copy; 2026 NOTchatsys. All rights reserved.</p>
    </footer>
</body>
